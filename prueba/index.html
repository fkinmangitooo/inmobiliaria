        <nav>

    <main>
        <section>
         <img src="./casa.png" width="300"/>

         <h1>Encuentra la casa de tus sueños</h1>

            <p>Descubre la propiedad perfecta para ti y tu familia.</p>
             
            <!--buscador de propiedades-->
            <div class="buscador-propiedades">
                <!--comprar o rentar-->
                <div class="campo-busqueda">
                    <label for="operación">¿Qué buscas?</label>
                    
                    <select name="operación" id="operación">
                        <option value="comprar">Comprar</option>
                        <option value="rentar">Rentar</option>
                    </select>
                </div>

                <!--ubicación-->
                <div class="campo-busqueda">
                    <label for="ubicacion">Ubicación</label>

                    <select id="ubicacion">
                        <option value="">Seleccionar ubicación</option>
                        <option value="zona 10">Zona 10</option>
                        <option value="zona 14">Zona 14</option>
                        <option value="zona 15">Zona 15</option>
                        <option value="Carretera a el salvador">Carretera a el salvador</option>
                        <option value="Mixco">Mixco</option>
                        </option>
                    </select>
                </div>

                <!--tipo de propiedad-->
                <div class="campo-busqueda">
                    <label for="tipo">Tipo de propiedad</label>
                    <select id="tipo">
                        <option value="">Seleccionar tipo</option>
                        <option value="casa">Casa</option>
                        <option value="apartamento">Apartamento</option>
                        <option value="terreno">Terreno</option>
                    </select>
                </div>

                <!--Boton-->
                <Button id="BuscarPropiedades">
                    Buscar
                </Button>

            </div>
            
        </section>

    </main>
